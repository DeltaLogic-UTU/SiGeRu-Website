</head>
<body data-protected-page="vecino">
<header class="site-header">
   <div class="container">
    <nav class="navbar navbar-expand-lg py-2 py-lg-3">
     <div aria-label="Ir al inicio de SiGeRU" class="navbar-brand logo-link" >
      <img alt="Logo de SiGeRU" class="brand-logo" src="../resources/logo.png"/>
     </div>
     <button aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegación" class="navbar-toggler" data-bs-target="#mainNav" data-bs-toggle="collapse" type="button">
      <span class="navbar-toggler-icon">
      </span>
     </button>
     <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
       <li class="nav-item">
        <a class="nav-link" href="vecino.html">
         Inicio
        </a>
       </li>
       <li class="nav-item">
        <a class="nav-link" href="reporte-vecino.html">
         Nuevo reporte
        </a>
       </li>
       <li class="nav-item">
        <a class="nav-link profile-nav-link active" aria-current="page" href="perfil.html" aria-label="Editar mi usuario" title="Mi usuario">
         <i class="bi bi-person-circle"></i><span class="visually-hidden">Mi usuario</span>
        </a>
       </li>
       <li class="nav-item mt-2 mt-lg-0">
        <button class="theme-toggle" data-theme-toggle="" type="button">
        </button>
       </li>
       <li class="nav-item mt-2 mt-lg-0">
        <a class="nav-link logout-link" data-logout href="../landing-page/login.html">

         <span>Cerrar sesión</span>
        </a>
       </li>
      </ul>
     </div>
    </nav>
   </div>
  </header>
<main>
 <section class="profile-page-user">
  <div class="container">
   <div class="section-title">
    <span class="tag">Cuenta de vecino</span>
    <h1>Mi usuario</h1>
    <p>Actualizá tus datos de contacto y tus credenciales. El tipo de usuario no se modifica desde esta pantalla.</p>
   </div>
   <div class="panel profile-panel-user">
    <form id="profileForm" novalidate>
     <div class="profile-form-grid">
      <label>Nombre
       <input class="form-control" name="nombre" required>
      </label>
      <label>Apellido
       <input class="form-control" name="apellido" required>
      </label>
      <label>Documento
       <input class="form-control" name="documento" required>
      </label>
      <label>Teléfono
       <input class="form-control" name="telefono" required>
      </label>
      <label>Correo
       <input class="form-control" name="email" type="email" required>
      </label>
      <label>Tipo de usuario
       <input class="form-control" value="Vecino" readonly>
      </label>
      <label>Nueva contraseña
       <input class="form-control" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Dejar vacío para mantenerla">
      </label>
      <label>Confirmar contraseña
       <input class="form-control" name="password_confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Repetir nueva contraseña">
      </label>
     </div>
     <div class="profile-actions">
      <div class="form-message" id="profileMessage" role="status"></div>
      <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar cambios</button>
     </div>
    </form>
   </div>
  </div>
 </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/perfil.js"></script>
</body>
</html>
