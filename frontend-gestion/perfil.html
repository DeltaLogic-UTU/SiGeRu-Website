<main class="container-fluid profile-page py-4">
 <div class="container-heading">
  <div>
   <span class="truck-kicker">Cuenta de Gestión</span>
   <h1>Mi usuario</h1>
   <p>Editá tus datos personales y credenciales. El rol de administrador no puede modificarse desde esta pantalla.</p>
  </div>
 </div>
 <section class="truck-panel profile-panel">
  <form id="profileForm" novalidate>
   <div class="profile-form-grid">
    <label class="form-label">Nombre
     <input class="form-control" name="nombre" required>
    </label>
    <label class="form-label">Apellido
     <input class="form-control" name="apellido" required>
    </label>
    <label class="form-label">Documento
     <input class="form-control" name="documento" required>
    </label>
    <label class="form-label">Teléfono
     <input class="form-control" name="telefono" required>
    </label>
    <label class="form-label">Correo
     <input class="form-control" name="email" type="email" required>
    </label>
    <label class="form-label">Rol
     <input class="form-control" value="Administrador" readonly>
    </label>
    <label class="form-label">Nueva contraseña
     <input class="form-control" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Dejar vacío para mantenerla">
    </label>
    <label class="form-label">Confirmar contraseña
     <input class="form-control" name="password_confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Repetir nueva contraseña">
    </label>
   </div>
   <div class="profile-actions">
    <p class="form-message mb-0" id="profileMessage" role="status"></p>
    <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar cambios</button>
   </div>
  </form>
 </section>
